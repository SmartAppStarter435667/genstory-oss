name: Deploy Viewer Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # ビルド時にNext.jsへ埋め込まれる公開URL(Repository Variablesで設定)
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build with OpenNext
        run: npm run cf:build

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy

      - name: Verify deployment (health check)
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::wrangler-actionからdeployment-urlが取得できませんでした。"
            exit 1
          fi
          echo "確認先: ${DEPLOY_URL}/api/health"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "${DEPLOY_URL}/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "OK (200): $(cat /tmp/health.json)"
              exit 0
            fi
            echo "試行 ${i}/5: ステータス ${STATUS}。5秒後に再試行します..."
            sleep 5
          done
          echo "::error::/api/health が5回試行しても200を返しませんでした(最終ステータス: ${STATUS})"
          exit 1

