name: Deploy Orchestrator

# GitHub-hosted runnerでビルド&GHCRへpush(OCI VMの限られたCPU/メモリを
# ビルドで消費しないため)し、OCI VMに登録したself-hostedランナーが
# 最新イメージをpullしてコンテナを再起動する2段構成。
#
# 前提: docs/github-actions-setup.md の手順でOCI VMにself-hosted runnerを
# 登録し、ラベル "oci-vm" を付与しておくこと。

on:
  push:
    branches: [main]
    paths:
      - "langchain/**"
      - "infra/docker-compose.yml"
      - ".github/workflows/deploy-orchestrator.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/orchestrator"
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: ./langchain
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, oci-vm]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest orchestrator image and restart
        working-directory: infra
        run: |
          # .envはgitの管理外・checkoutの外(ホームディレクトリ)に置いてある想定。
          # 詳細は docs/github-actions-setup.md 参照。
          docker compose --env-file ~/genstory-secrets/orchestrator.env pull orchestrator
          docker compose --env-file ~/genstory-secrets/orchestrator.env --profile core up -d
          docker image prune -f

      - name: Verify deployment (health check)
        run: |
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /tmp/healthz.json -w "%{http_code}" http://localhost:8000/healthz || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "OK (200): $(cat /tmp/healthz.json)"
              exit 0
            fi
            echo "試行 ${i}/6: ステータス ${STATUS}。5秒後に再試行します..."
            sleep 5
          done
          echo "::error::/healthz が6回試行しても200を返しませんでした(最終ステータス: ${STATUS})"
          echo "::error::docker compose logs orchestrator で詳細を確認してください。"
          exit 1

      - name: Verify tech stack (LLaMA/Ollama, LangChain, Milvus, image generation)
        run: |
          echo "== /stack-check の結果 =="
          RESPONSE=$(curl -s http://localhost:8000/stack-check)
          echo "$RESPONSE" | python3 -m json.tool

          OK=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['ok'])")
          if [ "$OK" != "True" ]; then
            echo "::error::必須コンポーネント(Ollama/LangChain/Milvus)のいずれかが正常ではありません。上記の詳細を確認してください。"
            exit 1
          fi
          echo "必須コンポーネントは正常です。画像生成経路(Workers AI / ComfyUI)は上記 image_generation を参照してください。"
