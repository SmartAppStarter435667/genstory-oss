name: Deploy API Gateway Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "scripts/provision-resources.sh"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Verify required secrets are set
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ]   && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::以下のGitHub Secretsが未設定です(Settings > Secrets and variables > Actions > Secretsタブ):$missing"
            echo "::error::docs/github-actions-setup.md の手順2・3を参照してください。"
            exit 1
          fi
          echo "必須Secretsはすべて設定されています。"

      # KV namespace / R2 bucket が無ければ作成し、KV IDを wrangler.jsonc へ注入する。
      # (Cloudflare REST APIを直接叩く冪等スクリプト。Terraformは使わない — 詳細はコミット履歴参照)
      - name: Provision KV namespace / R2 bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          chmod +x scripts/provision-resources.sh
          ./scripts/provision-resources.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: workers
        run: npm install

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy

      - name: Verify deployment (health check)
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::wrangler-actionからdeployment-urlが取得できませんでした。"
            exit 1
          fi
          echo "確認先: ${DEPLOY_URL}/health"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" "${DEPLOY_URL}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "OK (200): $(cat /tmp/health.json)"
              exit 0
            fi
            echo "試行 ${i}/5: ステータス ${STATUS}。5秒後に再試行します..."
            sleep 5
          done
          echo "::error::/health が5回試行しても200を返しませんでした(最終ステータス: ${STATUS})"
          exit 1
